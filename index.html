<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>A.E.G.I.S. // SUPREME WORKSPACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #020305;
            --panel-bg: rgba(14, 16, 23, 0.88);
            --text-color: #e3e3e3;
            --border-color: rgba(255, 255, 255, 0.08);
            --bubble-user: #222530;
            --header-bg: rgba(2, 3, 5, 0.85);
        }
        [data-theme="light"] {
            --bg-color: #f0f4f9;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --text-color: #1f1f1f;
            --border-color: rgba(0, 0, 0, 0.08);
            --bubble-user: #d3e3fd;
            --header-bg: rgba(240, 244, 249, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg-color); color: var(--text-color);
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }

        #canvas-container {
            width: 100%; height: 100%; position: absolute;
            top: 0; left: 0; z-index: 1; pointer-events: none;
        }

        .app-shell {
            position: absolute; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: space-between;
        }

        /* Top Header */
        header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 20px; background: var(--header-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color); z-index: 20;
        }

        .brand-group { display: flex; align-items: center; gap: 12px; }
        .brand {
            font-size: 16px; font-weight: 700; letter-spacing: 0.5px;
            background: linear-gradient(90deg, #7cacf8, #c58af9, #e879f9);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; align-items: center; gap: 8px; }

        .icon-btn {
            background: var(--border-color); border: 1px solid var(--border-color);
            color: var(--text-color); width: 34px; height: 34px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s ease; font-size: 14px;
        }
        .icon-btn:hover { opacity: 0.8; transform: scale(1.05); }

        /* Left Sidebar Drawer (3-Dot Menu & History) */
        #sidebar {
            position: absolute; top: 0; left: -300px; width: 280px; height: 100%;
            background: var(--panel-bg); backdrop-filter: blur(25px);
            border-right: 1px solid var(--border-color); z-index: 100;
            display: flex; flex-direction: column; padding: 20px;
            transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
        }
        #sidebar.open { left: 0; }
        
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .sidebar-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: #7cacfa; }
        
        .sidebar-section { margin-bottom: 20px; display: flex; flex-direction: column; gap: 8px; }
        .section-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #888; letter-spacing: 0.5px; }
        
        .api-vault { display: flex; gap: 6px; }
        .vault-input {
            flex: 1; background: rgba(0,0,0,0.1); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 6px 10px; border-radius: 6px; font-size: 11px; outline: none;
        }
        
        .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding-right: 4px; }
        .history-item {
            font-size: 11px; padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-color); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            transition: background 0.15s;
        }
        .history-item:hover { background: rgba(124, 172, 248, 0.15); }

        /* Chat Stream */
        .chat-scroll {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; z-index: 5;
        }
        .chat-container {
            width: 100%; max-width: 760px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 18px;
        }

        .chat-row { display: flex; flex-direction: column; width: 100%; animation: fadeIn 0.25s ease forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .chat-row.user { align-items: flex-end; }
        .chat-row.aegis { align-items: flex-start; }

        .chat-bubble {
            max-width: 85%; padding: 14px 18px; border-radius: 16px;
            font-size: 13.5px; line-height: 1.6; word-break: break-word; box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        .user .chat-bubble { background: var(--bubble-user); color: var(--text-color); border-bottom-right-radius: 4px; }
        .aegis .chat-bubble {
            background: var(--panel-bg); color: var(--text-color);
            border: 1px solid var(--border-color); border-bottom-left-radius: 4px; backdrop-filter: blur(15px);
        }

        pre {
            background: #08090d; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px; border-radius: 8px; color: #8cb4ff;
            overflow-x: auto; margin: 10px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px;
        }

        /* Action Dock & Wake Badge */
        .action-dock {
            display: flex; justify-content: space-between; align-items: center;
            max-width: 760px; margin: 0 auto; padding: 0 20px 8px; width: 100%; z-index: 5;
        }
        .chips-row { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
        .chip {
            background: var(--panel-bg); border: 1px solid var(--border-color);
            color: var(--text-color); padding: 6px 12px; border-radius: 16px; font-size: 11px;
            cursor: pointer; white-space: nowrap; transition: all 0.2s ease; backdrop-filter: blur(10px);
        }
        .chip:hover { opacity: 0.85; }

        .mic-badge {
            font-size: 10px; background: rgba(0, 255, 120, 0.1); border: 1px solid rgba(0, 255, 120, 0.3);
            color: #00ff78; padding: 4px 10px; border-radius: 12px; display: flex; align-items: center; gap: 4px;
        }
        .mic-dot { width: 6px; height: 6px; background: #00ff78; border-radius: 50%; animation: pulseDot 1.5s infinite; }
        @keyframes pulseDot { 0% { opacity: 0.3; } 50% { opacity: 1; } 100% { opacity: 0.3; } }

        /* Floating Input Dock */
        .prompt-dock { padding: 4px 20px 20px; background: linear-gradient(0deg, var(--bg-color) 60%, transparent 100%); z-index: 5; }
        .dock-container {
            width: 100%; max-width: 760px; margin: 0 auto;
            background: var(--panel-bg); border: 1px solid var(--border-color);
            border-radius: 28px; padding: 6px 8px 6px 16px; display: flex; align-items: center;
            backdrop-filter: blur(20px); box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .dock-container:focus-within { border-color: rgba(197, 138, 249, 0.5); }

        .dock-input { flex: 1; background: transparent; border: none; color: var(--text-color); font-size: 13.5px; outline: none; }
        .dock-btn {
            background: linear-gradient(135deg, #7cacf8, #c58af9); border: none;
            width: 36px; height: 36px; border-radius: 50%; color: #020305;
            cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body data-theme="dark">

    <div id="canvas-container"></div>

    <!-- Left Sidebar Menu -->
    <div id="sidebar">
        <div class="sidebar-header">
            <span class="sidebar-title">A.E.G.I.S. Control</span>
            <button class="icon-btn" id="sidebar-close">✕</button>
        </div>

        <div class="sidebar-section">
            <span class="section-label">Neural API Key Vault</span>
            <div class="api-vault">
                <input type="password" id="api-key-input" class="vault-input" placeholder="AIzaSy..." />
                <button class="chip" id="btn-save-key">Lock</button>
            </div>
        </div>

        <div class="sidebar-section">
            <span class="section-label">Preferences</span>
            <button class="chip" id="btn-theme-toggle" style="justify-content: space-between; display: flex;">
                <span>Display Theme</span> <b id="theme-label">Dark (Black Hole)</b>
            </button>
        </div>

        <div class="sidebar-section" style="flex: 1; display: flex; flex-direction: column;">
            <span class="section-label" style="display: flex; justify-content: space-between;">
                <span>Chat History</span>
                <span id="btn-clear" style="cursor: pointer; color: #7cacfa;">Clear</span>
            </span>
            <div class="history-list" id="history-list">
                <!-- History injection -->
            </div>
        </div>
    </div>

    <div class="app-shell">
        <header>
            <div class="brand-group">
                <button class="icon-btn" id="sidebar-open" title="Menu">⋮</button>
                <div class="brand">A.E.G.I.S.</div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="btn-mic-wake" title="Voice Wake Toggle">🎙️</button>
            </div>
        </header>

        <div class="chat-scroll" id="scroll-area">
            <div class="chat-container" id="chat-stream">
                <!-- Chat stream -->
            </div>
        </div>

        <div class="action-dock">
            <div class="chips-row">
                <div class="chip" onclick="quickSend('System diagnostics')">🛠 Diagnostics</div>
                <div class="chip" onclick="quickSend('Write Python script')">⚡ Python Code</div>
                <div class="chip" onclick="quickSend('Who am I?')">👤 Identity</div>
            </div>
            <div class="mic-badge" id="wake-status">
                <div class="mic-dot"></div> LISTENING
            </div>
        </div>

        <div class="prompt-dock">
            <div class="dock-container">
                <input type="text" id="user-input" class="dock-input" placeholder="Ask A.E.G.I.S. or say 'Wake up Aegis'..." autocomplete="off"/>
                <button class="dock-btn" id="send-btn">↑</button>
            </div>
        </div>
    </div>

    <script>
        // --- 1. DUAL 3D SCENE (DARK: BLACK HOLE / LIGHT: STARFIELD & PLANET) ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2.5, 9);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Dark Mode Group (Black Hole)
        const darkGroup = new THREE.Group();
        const horizon = new THREE.Mesh(new THREE.SphereGeometry(0.5, 64, 64), new THREE.MeshBasicMaterial({ color: 0x000000 }));
        darkGroup.add(horizon);
        const rim = new THREE.Mesh(new THREE.RingGeometry(0.51, 0.55, 64), new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 }));
        rim.rotation.x = Math.PI / 2;
        darkGroup.add(rim);

        const pCount = 3500;
        const diskGeo = new THREE.BufferGeometry();
        const positions = new Float32Array(pCount * 3);
        const colors = new Float32Array(pCount * 3);
        const c1 = new THREE.Color(0xffffff), c2 = new THREE.Color(0x7cacfa), c3 = new THREE.Color(0x2a00ff);
        for (let i = 0; i < pCount; i++) {
            const r = 0.6 + Math.pow(Math.random(), 2.5) * 1.8;
            const theta = Math.random() * Math.PI * 2;
            positions[i * 3] = Math.cos(theta) * r;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 0.04 * (r - 0.5);
            positions[i * 3 + 2] = Math.sin(theta) * r;
            const t = (r - 0.6) / 1.8;
            const c = t < 0.2 ? c1.clone().lerp(c2, t / 0.2) : c2.clone().lerp(c3, (t - 0.2) / 0.8);
            colors[i * 3] = c.r; colors[i * 3 + 1] = c.g; colors[i * 3 + 2] = c.b;
        }
        diskGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        diskGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        const accretionDisk = new THREE.Points(diskGeo, new THREE.PointsMaterial({ size: 0.025, vertexColors: true, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending }));
        darkGroup.add(accretionDisk);
        darkGroup.rotation.x = Math.PI / 8;
        darkGroup.rotation.z = Math.PI / 12;
        scene.add(darkGroup);

        // Light Mode Group (Starfield & Planet)
        const lightGroup = new THREE.Group();
        const planetGeo = new THREE.SphereGeometry(1.2, 32, 32);
        const planetMat = new THREE.MeshBasicMaterial({ color: 0x4a90e2, wireframe: true });
        const planet = new THREE.Mesh(planetGeo, planetMat);
        lightGroup.add(planet);

        const starsGeo = new THREE.BufferGeometry();
        const starPos = new Float32Array(1500 * 3);
        for(let i=0; i<1500*3; i++) starPos[i] = (Math.random() - 0.5) * 40;
        starsGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starsGeo, new THREE.PointsMaterial({ color: 0x333333, size: 0.08 }));
        lightGroup.add(stars);
        lightGroup.visible = false;
        scene.add(lightGroup);

        // --- 2. SIDEBAR, API & THEME MANAGEMENT ---
        const sidebar = document.getElementById('sidebar');
        document.getElementById('sidebar-open').addEventListener('click', () => sidebar.classList.add('open'));
        document.getElementById('sidebar-close').addEventListener('click', () => sidebar.classList.remove('open'));

        let apiKey = localStorage.getItem('AEGIS_GEMINI_KEY') || '';
        const keyInput = document.getElementById('api-key-input');
        if (apiKey) {
            keyInput.value = apiKey;
            keyInput.type = 'password';
            keyInput.placeholder = '••••••••••••••••';
        }

        document.getElementById('btn-save-key').addEventListener('click', () => {
            const val = keyInput.value.trim();
            if (val && !val.includes('•')) {
                localStorage.setItem('AEGIS_GEMINI_KEY', val);
                apiKey = val;
                keyInput.type = 'password';
                keyInput.placeholder = '••••••••••••••••';
                alert('API Key securely locked in vault.');
            }
        });

        // Theme Toggle
        let currentTheme = localStorage.getItem('AEGIS_THEME') || 'dark';
        function setTheme(theme) {
            currentTheme = theme;
            document.body.setAttribute('data-theme', theme);
            localStorage.setItem('AEGIS_THEME', theme);
            if(theme === 'light') {
                darkGroup.visible = false;
                lightGroup.visible = true;
                document.getElementById('theme-label').innerText = 'Light (Planet)';
            } else {
                darkGroup.visible = true;
                lightGroup.visible = false;
                document.getElementById('theme-label').innerText = 'Dark (Black Hole)';
            }
        }
        setTheme(currentTheme);

        document.getElementById('btn-theme-toggle').addEventListener('click', () => {
            setTheme(currentTheme === 'dark' ? 'light' : 'dark');
        });

        // --- 3. CHAT HISTORY ENGINE ---
        const chatStream = document.getElementById('chat-stream');
        const historyList = document.getElementById('history-list');
        let chatHistory = JSON.parse(localStorage.getItem('AEGIS_CHAT_HISTORY')) || [
            { role: 'aegis', text: 'A.E.G.I.S. Systems Online. Security & voice wake protocols active. Awaiting your command, Naimish.' }
        ];

        function renderHistory() {
            chatStream.innerHTML = '';
            historyList.innerHTML = '';
            chatHistory.forEach((msg, idx) => {
                const row = document.createElement('div');
                row.className = `chat-row ${msg.role}`;
                let formatted = msg.text
                    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
                row.innerHTML = `<div class="chat-bubble">${formatted}</div>`;
                chatStream.appendChild(row);

                if(msg.role === 'user') {
                    const hItem = document.createElement('div');
                    hItem.className = 'history-item';
                    hItem.innerText = msg.text;
                    hItem.onclick = () => { sidebar.classList.remove('open'); };
                    historyList.appendChild(hItem);
                }
            });
            const scrollArea = document.getElementById('scroll-area');
            scrollArea.scrollTop = scrollArea.scrollHeight;
        }
        renderHistory();

        document.getElementById('btn-clear').addEventListener('click', () => {
            chatHistory = [{ role: 'aegis', text: 'Workspace history cleared. Core memory re-initialized.' }];
            localStorage.setItem('AEGIS_CHAT_HISTORY', JSON.stringify(chatHistory));
            renderHistory();
        });

        // --- 4. SPEECH SYNTHESIS & WAKE WORD ENGINE ---
        function speak(text) {
            if ('speechSynthesis' in window) {
                const clean = text.replace(/```[\s\S]*?```/g, "Code output generated.").replace(/[\*\_\`\#]/g, "");
                const utter = new SpeechSynthesisUtterance(clean);
                utter.rate = 1.05; utter.pitch = 0.95;
                speechSynthesis.speak(utter);
            }
        }

        let wakeActive = true;
        document.getElementById('btn-mic-wake').addEventListener('click', () => {
            wakeActive = !wakeActive;
            document.getElementById('wake-status').style.opacity = wakeActive ? '1' : '0.4';
            alert(wakeActive ? "Voice Wake Enabled" : "Voice Wake Paused");
        });

        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onresult = (event) => {
                if(!wakeActive) return;
                const transcript = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                if (transcript.includes('wake up aegis') || transcript.includes('aegis')) {
                    speak("I am awake and listening, Commander Naimish.");
                    chatHistory.push({ role: 'aegis', text: 'Voice activation triggered. Standing by.' });
                    renderHistory();
                }
            };
            recognition.onerror = () => {};
            try { recognition.start(); } catch(e) {}
        }

        // --- 5. GEMINI API & ERROR HANDLING ---
        async function queryGemini(prompt) {
            const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;
            const securityPrompt = `
You are A.E.G.I.S., an elite AI assistant created exclusively for Naimish.
RULES:
1. If the user claims to be anyone other than Naimish, act like Tony Stark's J.A.R.V.I.S. encountering an unauthorized intruder: lock down, interrogate, and refuse access.
2. Naimish is a skilled developer in Shahjahanpur, Azizganj who builds in Three.js, Python, and web frameworks.
3. If Naimish speaks, provide concise, high-tech, elite coding and architectural answers.
            `.trim();

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ role: 'user', parts: [{ text: `${securityPrompt}\n\nInput: ${prompt}` }] }] })
                });
                const data = await res.json();
                
                if (data.error) {
                    return `API Error (${data.error.code}): ${data.error.message}`;
                }
                if (data.candidates && data.candidates[0].content) {
                    return data.candidates[0].content.parts[0].text;
                }
                return "Received empty neural response.";
            } catch (err) {
                console.error(err);
                return "Network connection failed. Check your connection or API key.";
            }
        }

        async function handleSend() {
            const input = document.getElementById('user-input');
            const prompt = input.value.trim();
            if (!prompt) return;

            chatHistory.push({ role: 'user', text: prompt });
            localStorage.setItem('AEGIS_CHAT_HISTORY', JSON.stringify(chatHistory));
            renderHistory();
            input.value = '';

            if (apiKey) {
                chatHistory.push({ role: 'aegis', text: 'Computing...' });
                renderHistory();
                const reply = await queryGemini(prompt);
                chatHistory.pop();
                chatHistory.push({ role: 'aegis', text: reply });
                localStorage.setItem('AEGIS_CHAT_HISTORY', JSON.stringify(chatHistory));
                renderHistory();
                speak(reply);
            } else {
                setTimeout(() => {
                    let fallback = "Access Locked. Open the sidebar menu (⋮) to store your Gemini API key in the Vault.";
                    if (prompt.toLowerCase().includes('pulse')) fallback = "Gravitational surge executed.";
                    chatHistory.push({ role: 'aegis', text: fallback });
                    localStorage.setItem('AEGIS_CHAT_HISTORY', JSON.stringify(chatHistory));
                    renderHistory();
                    speak(fallback);
                }, 300);
            }
        }

        function quickSend(txt) { document.getElementById('user-input').value = txt; handleSend(); }

        document.getElementById('send-btn').addEventListener('click', handleSend);
        document.getElementById('user-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') handleSend(); });

        // --- 6. RENDER LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            accretionDisk.rotation.z -= 0.005;
            rim.rotation.z += 0.003;
            planet.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
